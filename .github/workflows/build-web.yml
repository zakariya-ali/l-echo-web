name: Build and Deploy L-Echo Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apply_web_port.py"
      - "build-web.sh"
      - "web/**"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port kit
        uses: actions/checkout@v6

      - name: Checkout upstream L-Echo
        uses: actions/checkout@v6
        with:
          repository: LibreGamesArchive/l-echo
          path: l-echo

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest

      - name: Verify toolchain
        run: em++ --version

      - name: Build web version
        run: bash ./build-web.sh ./l-echo

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: l-echo-web
          path: l-echo/dist/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: l-echo/dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
